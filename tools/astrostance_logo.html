<title>AstroStance — Logo &amp; Banner</title>

  :root {
    --navy-deep: #0B1026;
    --indigo: #2A2160;
    --gold: #FFD155;
    --cyan: #4DE3FF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background-color: #1b1b1f;
    background-image:
      linear-gradient(45deg, #262629 25%, transparent 25%),
      linear-gradient(-45deg, #262629 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #262629 75%),
      linear-gradient(-45deg, transparent 75%, #262629 75%);
    background-size: 28px 28px;
    background-position: 0 0, 0 14px, 14px -14px, -14px 0px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 56px;
    padding: 64px 24px;
    font-family: 'Segoe UI', 'Kanit', sans-serif;
  }

  .stage-label {
    color: #8b8fa3;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    text-align: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ─── Shared emblem language ─────────────────────────────────────────── */

  .emblem-glow {
    position: absolute;
    inset: -34px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(77,227,255,0.45), rgba(77,227,255,0) 68%);
    filter: blur(4px);
  }

  .emblem-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 10px solid var(--gold);
    box-shadow:
      0 0 22px rgba(255, 209, 85, 0.65),
      inset 0 0 14px rgba(255, 209, 85, 0.45);
  }

  .emblem-dome {
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #454b93 0%, #1c1e42 62%, #101226 100%);
    box-shadow: inset 0 0 34px rgba(0,0,0,0.65), inset 0 -10px 24px rgba(0,0,0,0.4);
    overflow: hidden;
  }

  .emblem-visor {
    position: absolute;
    left: 13%;
    right: 13%;
    top: 24%;
    height: 32%;
    border-radius: 50% 50% 46% 46% / 65% 65% 35% 35%;
    background: linear-gradient(160deg, rgba(255,255,255,0.92) 0%, var(--cyan) 42%, #1c7fa3 100%);
    box-shadow: 0 0 16px rgba(77,227,255,0.75);
  }

  .emblem-visor::after {
    content: '';
    position: absolute;
    left: 10%;
    top: 14%;
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    filter: blur(2px);
  }

  .emblem-spark {
    position: absolute;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px rgba(255,209,85,0.9);
  }

    height: 3px;

    background: linear-gradient(90deg, rgba(77,227,255,0) 0%, rgba(77,227,255,0.55) 55%, rgba(255,255,255,0.95) 100%);

      0 0 26px 10px rgba(77,227,255,0.75);

  #banner .lanes {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 1200px;
    height: 210px;
    opacity: 0.85;
  }

  #banner::after {
    /* soft floor fade so the lane lines sit inside atmosphere, not on bare gradient */
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 210px;
    background: linear-gradient(180deg, rgba(11,16,38,0) 0%, rgba(11,16,38,0.55) 100%);

      <div class="emblem emblem-badge">
        <div class="emblem-glow"></div>

          <div class="emblem-visor"></div>
        </div>
        <div class="emblem-spark s1"></div>
        <div class="emblem-spark s2"></div>
      </div>

      <div class="wordmark">ASTRO STANCE</div>
    </div>
  </div>
